name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax check
        run: |
          node --check main.js
          for f in scripts/*.js; do node --check "$f"; done
      - name: Validate package metadata
        run: node -e "const p=require('./package.json'); if(!p.main||!p.build) process.exit(1); console.log(p.name, p.version);"
      - name: Repo hygiene
        run: |
          test -f LICENSE
          test -f README.md
          test -f assets/icon.png
          test -f assets/tray.png
          test -f build/icon.ico
